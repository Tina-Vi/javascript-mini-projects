<!DOCTYPE html>
<html lang="ru" >
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Калькулятор</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">
    <div class="display">
        <input type="button" value="0" class="zero">
    </div>
    <div class="keyboard">
        <button class="btn upper-line">AC</button>
        <button class="btn upper-line">+/-</button>
        <button class="btn upper-line">%</button>
        <button class="btn right-column">&divide;</button>

        <button class="btn numbers">7</button>
        <button class="btn numbers">8</button>
        <button class="btn numbers">9</button>
        <button class="btn right-column">&times;</button>

        <button class="btn numbers">4</button>
        <button class="btn numbers">5</button>
        <button class="btn numbers">6</button>
        <button class="btn right-column">&minus;</button>

        <button class="btn numbers">1</button>
        <button class="btn numbers">2</button>
        <button class="btn numbers">3</button>
        <button class="btn right-column">+</button>

        <button class="btn numbers">#</button>
        <button class="btn numbers">0</button>
        <button class="btn numbers">.</button>
        <button class="btn right-column">=</button>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
